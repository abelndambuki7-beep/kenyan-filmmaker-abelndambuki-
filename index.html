<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abel Ndambuki – Photographer, Cinematographer &amp; Filmmaker</title>
<style>
:root{--bg:#0e0e12;--tx:#f3f1ec;--mu:#a29fb0;--cd:#18181f;--ln:#2a2a35;--ac:#e8b04a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f4ef;--tx:#1b1a22;--mu:#605d70;--cd:#fff;--ln:#ddd8cc;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0e0e12;--tx:#f3f1ec;--mu:#a29fb0;--cd:#18181f;--ln:#2a2a35;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:60px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,"Times New Roman",serif;line-height:1.65}
.w{max-width:1000px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);font-family:system-ui,sans-serif;font-size:.85rem}
nav .w{display:flex;gap:18px;overflow-x:auto;padding:14px 20px;white-space:nowrap}
nav a{color:var(--mu);text-decoration:none}nav a:last-child{color:var(--ac)}
.hero{min-height:78vh;display:flex;align-items:flex-end;padding:60px 0;background-size:cover;background-position:center}
.hero h1{font-size:clamp(2.4rem,10vw,4.8rem);line-height:1.02;margin:0 0 10px;font-weight:400}
.tag{font-family:system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--ac)}
.hero p{max-width:560px;color:var(--mu)}
section{padding:54px 0;border-top:1px solid var(--ln)}
h2{font-weight:400;font-size:1.8rem;margin:0 0 18px}
.mut{color:var(--mu)}
.btn,.b{display:inline-block;font-family:system-ui,sans-serif;font-size:.9rem;background:var(--ac);color:#111;border:0;border-radius:999px;padding:11px 22px;text-decoration:none;cursor:pointer;margin:6px 8px 0 0;font-weight:600}
.btn.alt,.b{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.b.gold{background:var(--ac);color:#111;border-color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.chip{font-family:system-ui,sans-serif;font-size:.8rem;background:none;color:var(--mu);border:1px solid var(--ln);border-radius:999px;padding:7px 14px;white-space:nowrap;cursor:pointer}
.chip.on{color:#111;background:var(--ac);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
figure{margin:0;position:relative}
figure img,figure video,.play{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;background:var(--cd);cursor:pointer}
.play{border:1px solid var(--ln);color:var(--ac);font-size:2rem}
.ic{display:flex;gap:14px;flex-wrap:wrap}.ic a{width:54px;height:54px;border:1px solid var(--ln);border-radius:50%;display:grid;place-items:center;color:var(--ac)}.ic svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.cat{position:relative;aspect-ratio:4/3;border:0;border-radius:14px;cursor:pointer;color:#fff;text-align:left;padding:0;overflow:hidden}.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}.cat:hover img{transform:scale(1.05)}.cat span{position:absolute;left:0;right:0;bottom:0;padding:50px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.82));font-size:1.2rem}.cat small{display:block;font-family:system-ui,sans-serif;font-size:.78rem;opacity:.85}
.yt{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;display:block;background:var(--cd)}

.pic{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--cd);border:1px solid var(--ln)}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:18px;font-family:system-ui,sans-serif}
.card h3{margin:0 0 6px;font-size:1rem;font-weight:600}.card p{margin:0;color:var(--mu);font-size:.9rem}
.fm{display:grid;gap:10px;max-width:560px;font-family:system-ui,sans-serif}
input,select,textarea{width:100%;background:var(--cd);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:11px;font:inherit}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding:12px;border:1px dashed var(--ac);border-radius:10px;font-family:system-ui,sans-serif}
.bar>*{flex:1 1 140px}
.ce{outline:1px dashed var(--ac);outline-offset:3px;display:inline-block;min-width:30px}
.ebar{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;gap:8px}

if(k==='v')return `<div class="bar">${sel}<input class="ti" placeholder="Title (optional)"><input class="u" placeholder="Paste YouTube, Vimeo or other link"><button class="b gold" data-addlink="1">Add link</button><div>Or upload a short clip (max 20 MB):${f('video/*')}</div></div>`;
return `<div class="bar">${sel}<div>Upload photos:${f('image/*')}</div></div>`}
function gal(k){const c=SEC[k],f=flt[k]||'All';
const its=S.items.map((x,i)=>({...x,i})).filter(x=>x.k===k&&(f==='All'||x.cat===f));
return `<section id="${c.id}"><div class="w"><h2>${c.h}</h2><div class="chips">${['All',...c.cats].map(x=>`<button class="chip${x===f?' on':''}" data-f="${k}|${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="grid">${its.map(card).join('')||'<p class="mut">Work coming soon.</p>'}</div>${edit?bar(k):''}</div></section>`}
const slot=(s,label)=>edit?`<div class="bar"><div>${label}<input type="file" accept="image/*" data-t="img" data-s="${s}"></div></div>`:'';
const docb=(s,label)=>`<div class="card"><h3>${label}</h3>${S.files[s]?`<a class="btn" href="${S.files[s]}" download="Abel-Ndambuki-${s==='cv'?'CV':'Profile'}.pdf" data-dl="Abel-Ndambuki-${s==='cv'?'CV':'Profile'}.pdf">Download PDF</a><a class="btn alt" href="${S.files[s]}" target="_blank" rel="noopener">View</a>`:'<p>Coming soon.</p>'}${edit?`<div class="bar"><div>Upload PDF:<input type="file" accept="application/pdf" data-t="file" data-s="${s}"></div></div>`:''}</div>`;
const fld=(id,l,t='input')=>`<label class="mut">${l}</label><${t} id="${id}"${t==='textarea'?' rows="4"':''}></${t}>`.replace('<input id','<input id').replace('></input>','>');
function fb(el){if(!el.dataset.r){el.dataset.r=1;el.src=el.src.replace('/img/','/')}}function gal2(k){const c=SEC[k],cur=flt[k]||'',all=S.items.map((x,i)=>({...x,i})).filter(x=>x.k===k);const cover=cat=>{const its=all.filter(x=>x.cat===cat),cv=(S.covers||{})[k+'|'+cat];if(cv)return cv;const im=its.find(x=>x.type==='img');if(im)return im.url;const v=its.find(x=>x.type==='link'&&/youtu/.test(x.url)&&embed(x.url));return v&&!window.claude?embed(v.url).replace('www.youtube.com/embed/','img.youtube.com/vi/')+'/hqdefault.jpg':''};let h=`<section id="${c.id}"><div class="w"><h2>${c.h}</h2>`;if(!cur){h+='<div class="cats">'+c.cats.map((cat,n)=>{const its=all.filter(x=>x.cat===cat);if(!its.length&&!edit)return'';const cv=cover(cat);return `<button class="cat" data-f="${k}|${esc(cat)}" style="background:linear-gradient(135deg,hsl(${250+n*40} 35% 32%),hsl(${290+n*40} 30% 18%))">${cv?`<img src="${cv}" alt="" loading="lazy" onerror="fb(this)">`:''}<span>${esc(cat)}<small>${its.length} ${its.length===1?'item':'items'}</small></span></button>`}).join('')+'</div>'}else{const its=all.filter(x=>x.cat===cur);h+=`<button class="b" data-f="${k}|">← All ${c.h} categories</button><h3 style="margin:18px 0">${esc(cur)}</h3><div class="grid">${its.map(card).join('')||'<p class="mut">Work coming soon.</p>'}</div>`;if(edit)h+=bar(k).replace('<option>'+esc(cur)+'</option>','<option selected>'+esc(cur)+'</option>')}return h+'</div></section>'}
function render(){
const hero=S.img.hero?`background-image:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.75)),url('${S.img.hero}')`:'';
$('#app').innerHTML=`<nav><div class="w"><a href="#top">Home</a><a href="#photography">Photography</a><a href="#films">Films / Video</a><a href="#selected">Selected Work</a><a href="#about">About</a><a href="#services">Services</a><a href="#contact">Contact</a><a href="#book">Book a Shoot</a></div></nav>
<header id="top" class="hero" style="${hero}"><div class="w"><div class="tag">${ed('tag','Photographer · Cinematographer · Filmmaker')}</div><h1>${ed('name','Abel Ndambuki')}</h1><p>${ed('intro','Cinematic, minimal and editorial visual storytelling, from corporate events to documentary films. Based in Kitengela, Kenya.','span')}</p><a class="btn" href="#book">Book a Shoot</a><a class="btn alt" href="#selected">Selected Work</a>${slot('hero','Hero background photo:')}</div></header>
${gal2('p')}${gal2('v')}${gal2('s')}
<section><div class="w two"><div><img class="pic" onerror="fb(this)" ${S.img.portrait?`src="${S.img.portrait}"`:''} alt="Abel Ndambuki behind the lens">${slot('portrait','Portrait:')}</div><div><div class="tag">Behind the Lens</div><h2>${ed('bl','The person behind the camera')}</h2><p class="mut">${ed('bld','I believe the best images come from paying attention to people. Behind every frame is a story worth telling.')}</p></div></div></section>
<section id="about"><div class="w"><h2>About Me</h2><p>${ed('about1','I’m Abel Ndambuki, a photographer, cinematographer and filmmaker based in Kitengela, Kenya. I tell real stories through images and film, from corporate events and portraits to documentaries and community stories.')}</p><p class="mut">${ed('about2','I’m continuing my film studies and growing my craft behind the camera, with a strong interest in cinematography and visual storytelling.')}</p></div></section>
<section><div class="w"><h2>Professional Profile &amp; CV</h2><div class="grid">${docb('profile','Professional Profile')}${docb('cv','CV / Resume')}</div></div></section>
<section id="services"><div class="w"><h2>Services</h2><div class="grid">${SERV.map((s,i)=>`<div class="card"><h3>${s[0]}</h3><p>${ed('sv'+i,s[1])}</p></div>`).join('')}</div></div></section>
<section id="book"><div class="w"><h2>Book a Shoot</h2><p class="mut">Tell me about your project and I’ll get back to you.</p><div class="fm">${fld('b1','Your name')}${fld('b2','Email address')}<label class="mut">Type of project</label><select id="b3"><option>Documentary Production</option><option>Corporate Photography</option><option>Event Coverage &amp; Highlights</option><option>Cinematography</option></select>${fld('b4','Project details','textarea')}${fld('b5','Date or proposed schedule')}${fld('b6','Location')}${fld('b7','Additional information','textarea')}<div><button class="btn" data-send="book|wa">Send via WhatsApp</button><button class="btn alt" data-send="book|mail">Send via email</button></div></div></div></section>
<section id="contact"><div class="w"><h2>Send a Message</h2><div class="fm">${fld('c1','Full names')}${fld('c2','Company (optional)')}${fld('c3','Email')}${fld('c4','Message','textarea')}<div><button class="btn" data-send="contact|wa">Send via WhatsApp</button><button class="btn alt" data-send="contact|mail">Send via email</button></div></div><h2 style="margin-top:40px">Contact</h2><div class="ic"><a href="mailto:abelndambuki7@gmail.com" aria-label="Email"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></a><a href="https://wa.me/254710535371" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.5L3 21z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1.2-1.6-2.2-1.2-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1.2-2.2L9 8.5z"/></svg></a><a href="https://instagram.com/abelnarium" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg></a><a href="https://www.facebook.com/share/1EF6GEnoGF/" target="_blank" rel="noopener" aria-label="Facebook"><svg viewBox="0 0 24 24"><path d="M14 21v-8h2.7l.5-3.2H14V8c0-1 .5-1.8 1.9-1.8h1.5V3.3C17 3.2 16 3 15 3c-2.5 0-4.1 1.5-4.1 4.2v2.6H8.2V13h2.7v8H14z"/></svg></a></div></div></section>
<footer>© 2026 Abel Ndambuki · Kitengela, Kenya</footer>
${canEdit?`<div class="ebar"><button class="b" data-a="edit">${edit?'Done editing':'✎ Edit site'}</button><button class="b" data-a="zip">⬇ Site ZIP</button>${edit?'<button class="b gold" data-a="save">Save &amp; publish</button>':''}</div>`:''}`}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),3500)}
function shrink(f){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,2000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.85)};i.onerror=rej;i.src=URL.createObjectURL(f)})}
async function upload(f){const b=f.type.startsWith('image/')?await shrink(f):f;return (await assets.upload(b)).url}
function show(h){const o=document.createElement('div');o.className='ov';o.innerHTML=h+'<a href="#" data-x="1">Close</a>';o.onclick=e=>{if(e.target===o||e.target.dataset.x){e.preventDefault();o.remove()}};document.body.append(o)}
function embed(u){let m=u.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/);if(m)return 'https://www.youtube.com/embed/'+m[1];m=u.match(/vimeo\.com\/(\d+)/);return m?'https://player.vimeo.com/video/'+m[1]:null}
function send(t,via){const g=id=>(($('#'+id)||{}).value||'').trim();
const L=t==='book'?[['Name','b1'],['Email','b2'],['Project type','b3'],['Details','b4'],['Date','b5'],['Location','b6'],['Extra','b7']]:[['Name','c1'],['Company','c2'],['Email','c3'],['Message','c4']];
const txt=(t==='book'?'Shoot request\n':'Message from website\n')+L.map(x=>x[0]+': '+g(x[1])).join('\n');
const u=via==='wa'?'https://wa.me/254710535371?text='+encodeURIComponent(txt):'mailto:abelndambuki7@gmail.com?subject='+encodeURIComponent(t==='book'?'Shoot request':'Website message')+'&body='+encodeURIComponent(txt);
const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove()}
function snapshot(){const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelectorAll('.ov,.toast').forEach(e=>e.remove());c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');return '<!DOCTYPE html>'+c.outerHTML}
async function zipSite(){try{const dl=await claude.use('downloads');if(!dl)return toast('Download is not available here');if(!window.JSZip)return toast('Zip tool did not load, try again');toast('Preparing your site files, this can take a minute…');const z=new JSZip(),map={},T=JSON.parse(JSON.stringify(S)),ids=new Set();const grab=u=>{if(u&&u.startsWith('/_blob/'))ids.add(u)};T.items.forEach(x=>grab(x.url));Object.values(T.img).forEach(grab);Object.values(T.files).forEach(grab);Object.values(T.covers||{}).forEach(grab);const ex={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','application/pdf':'pdf','video/mp4':'mp4','video/webm':'webm'};for(const u of ids){const b=await (await fetch(u)).blob();const p='img/'+u.slice(7)+'.'+(ex[b.type]||'bin');z.file(p,b);map[u]=p}T.items.forEach(x=>{if(map[x.url])x.url=map[x.url]});for(const k in T.img)if(map[T.img[k]])T.img[k]=map[T.img[k]];for(const k in T.files)if(map[T.files[k]])T.files[k]=map[T.files[k]];for(const k in (T.covers||{}))if(map[T.covers[k]])T.covers[k]=map[T.covers[k]];const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelectorAll('.ov,.toast').forEach(e=>e.remove());c.querySelector('#data').textContent=JSON.stringify(T).replace(/</g,String.fromCharCode(92)+'u003c');z.file('index.html','<!DOCTYPE html>'+c.outerHTML);const out=await z.generateAsync({type:'blob'});await dl.save({filename:'abel-portfolio-site.zip',data:out})}catch(x){toast('Could not create ZIP: '+(x.code||x.message))}}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a],[data-f],[data-del],[data-open],[data-play],[data-addlink],[data-send],[data-dl],[data-cover]');if(!t)return;const d=t.dataset;
if(d.a==='edit'){edit=!edit;try{sessionStorage.setItem('edit',edit?'1':'')}catch(_){}render()}
else if(d.a==='zip'){zipSite()}else if(d.a==='save'){try{toast('Publishing…');await artifact.publish(snapshot())}catch(x){toast('Could not publish: '+(x.code||x.message))}}
else if(d.f){const[k,c]=d.f.split('|');flt[k]=c;render();const s=$('#'+SEC[k].id);if(s)s.scrollIntoView()}else if(d.cover){const x=S.items[+d.cover];(S.covers=S.covers||{})[x.k+'|'+x.cat]=x.url;toast('Set as the category cover')}
else if(d.del){S.items.splice(+d.del,1);render()}
else if(d.open)show(`<img src="${t.src}" alt="">`);
else if(d.play){const u=S.items[+d.play].url,m=embed(u);show((m?`<iframe src="${m}" allow="fullscreen" allowfullscreen></iframe>`:'')+`<a href="${esc(u)}" target="_blank" rel="noopener">Open video in new tab ↗</a>`)}
else if(d.addlink){const b=t.closest('.bar');let u=$('.u',b).value.trim();if(!u)return toast('Paste a link first');if(!/^https?:/.test(u))u='https://'+u;S.items.push({k:'v',cat:$('select',b).value,type:'link',url:u,title:$('.ti',b).value.trim()});render()}
else if(d.send){const[a,b]=d.send.split('|');send(a,b)}else if(d.dl&&window.claude){e.preventDefault();try{const dl=await claude.use('downloads');if(!dl)return toast('Download is not available here');const b=await (await fetch(t.getAttribute('href'))).blob();await dl.save({filename:d.dl,data:b})}catch(x){toast('Could not download the file')}}});
document.addEventListener('change',async e=>{const el=e.target,d=el.dataset;if(el.type!=='file'||!d.t||!assets)return toast(assets?'':'Uploads are not available');
toast('Uploading…');const cat=el.closest('.bar')&&$('select',el.closest('.bar'));
for(const f of el.files){try{const url=await upload(f);if(d.t==='gal')S.items.push({k:d.k,cat:cat.value,type:f.type.startsWith('video/')?'vid':'img',url,title:''});else if(d.t==='img')S.img[d.s]=url;else S.files[d.s]=url}catch(x){toast('Could not upload '+f.name)}}
render()});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k&&e.target.isContentEditable)S.texts[k]=e.target.textContent});
render();
(async()=>{try{if(!window.claude)return;const u=await claude.use('user');artifact=await claude.use('artifact');assets=await claude.use('assets');
canEdit=!!(u&&artifact&&await u.canEdit());if(canEdit){try{edit=sessionStorage.getItem('edit')==='1'}catch(_){}render()}}catch(_){}})();
</script>
